<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Woreda — Birth Registration Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1b3e;
      font-family: 'Inter', 'Noto Sans Ethiopic', sans-serif;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    .emblem { font-size: 3.5rem; margin-bottom: 20px; }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .amharic {
      font-family: 'Noto Sans Ethiopic', sans-serif;
      font-size: 0.95rem;
      opacity: 0.6;
      margin-bottom: 32px;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: #f59e0b;
      border-radius: 2px;
      margin: 0 auto 32px;
    }

    .btn {
      display: inline-block;
      background: #f59e0b;
      color: #1a1200;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 36px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: #d97706; transform: translateY(-2px); }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.75rem;
      opacity: 0.35;
    }
  </style>
</head>
<body>

  <div class="emblem">🏛️</div>
  <h1>Digital Woreda</h1>
  <p class="amharic">የፌደራል ሲቪል ምዝገባ እና የነዋሪነት አገልግሎት ኤጀንሲ</p>
  <div class="divider"></div>
  <a href="https://your-live-app-url.com" class="btn">Enter the Portal →</a>

  <footer>CRRSA · Ethiopia 🇪🇹</footer>

</body>
</html>
